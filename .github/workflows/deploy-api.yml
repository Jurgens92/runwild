# Deploys the live API (Supabase Edge Function "api") whenever the backend code changes on main,
# or when started by hand from the Actions tab.
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN
#   Supabase dashboard → your avatar → Account preferences → Access Tokens → Generate new token.
#   GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret.
# The database password is NOT needed here and should never be stored in the repo.

name: Deploy API to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'

env:
  PROJECT_REF: oawrrygfebxbmlzevnhf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the function has the latest backend code, and run the tests
        run: |
          npm ci
          npm test

      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (see the top of this file)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
